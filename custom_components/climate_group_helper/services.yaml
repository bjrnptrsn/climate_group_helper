set_schedule_entity:
  target:
    entity:
      integration: climate_group_helper
      domain: climate
  fields:
    schedule_entity:
      selector:
        entity:
          filter:
            - domain: schedule
            - domain: calendar
      required: false

set_schedule_bypass_entity:
  target:
    entity:
      integration: climate_group_helper
      domain: climate
  fields:
    schedule_bypass_entity:
      selector:
        entity:
          filter:
            - domain: schedule
            - domain: calendar
      required: false

set_schedule_fallback_payload:
  target:
    entity:
      integration: climate_group_helper
      domain: climate
  fields:
    fallback_payload:
      selector:
        object:
      required: false

set_schedule_hold_duration:
  target:
    entity:
      integration: climate_group_helper
      domain: climate
  fields:
    duration:
      required: false
      selector:
        number:
          min: 0
          max: 480
          step: 5
          unit_of_measurement: "min"

set_group_preset:
  target:
    entity:
      integration: climate_group_helper
      domain: climate
  fields:
    payload:
      selector:
        object:
      required: false

boost:
  target:
    entity:
      integration: climate_group_helper
      domain: climate
  fields:
    hvac_mode:
      required: false
      selector:
        select:
          options:
            - heat
            - cool
            - dry
            - fan_only
          mode: dropdown
    temperature:
      required: false
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    temperature_offset:
      required: false
      selector:
        number:
          min: -20
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      required: true
      selector:
        number:
          min: 1
          max: 480
          step: 1
          unit_of_measurement: "min"

apply_config:
  target:
    entity:
      integration: climate_group_helper
      domain: climate
  fields:
    settings:
      required: true
      selector:
        template:
    include_member_list:
      required: true
      default: false
      selector:
        boolean:
    include_entity_selectors:
      required: true
      default: false
      selector:
        boolean:

reset:
  target:
    entity:
      integration: climate_group_helper
      domain: climate
  fields:
    everything:
      selector:
        boolean:
      default: false
      required: false
    boost:
      selector:
        boolean:
      default: false
      required: false
    offset:
      selector:
        boolean:
      default: false
      required: false
    schedule:
      selector:
        boolean:
      default: false
      required: false
    bypass:
      selector:
        boolean:
      default: false
      required: false
    fallback:
      selector:
        boolean:
      default: false
      required: false
    presets:
      selector:
        boolean:
      default: false
      required: false
