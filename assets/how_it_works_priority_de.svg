<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Was Vorrang hat: Hauptschalter, offenes Fenster, niemand zu Hause, Boost, dann der Zielzustand der Gruppe</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="470" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- Vorrang-Achse -->
  <line x1="50" y1="410" x2="50" y2="40" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="38" y="225" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" transform="rotate(-90 38 225)">hat Vorrang</text>

  <g fill="#1f2328">
    <!-- 1 Hauptschalter -->
    <rect x="80" y="30" width="470" height="62" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
    <text x="100" y="56" font-size="16" font-weight="700">Hauptschalter aus</text>
    <text x="100" y="78" font-size="13" fill="#57606a">Alle Geräte aus — auch isolierte.</text>

    <!-- 2 Fenster -->
    <rect x="80" y="104" width="470" height="62" rx="10" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
    <text x="100" y="130" font-size="16" font-weight="700">Fenster offen</text>
    <text x="100" y="152" font-size="13" fill="#57606a">Aus, oder die Zieltemperatur bei offenem Fenster.</text>

    <!-- 3 Anwesenheit -->
    <rect x="80" y="178" width="470" height="62" rx="10" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
    <text x="100" y="204" font-size="16" font-weight="700">Niemand zu Hause</text>
    <text x="100" y="226" font-size="13" fill="#57606a">Die Abwesenheits-Aktion: aus, Versatz, Temperatur oder Preset.</text>

    <!-- 4 Boost -->
    <rect x="80" y="252" width="470" height="62" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
    <text x="100" y="278" font-size="16" font-weight="700">Boost</text>
    <text x="100" y="300" font-size="13" fill="#57606a">Die Boost-Temperatur, so lange wie angefordert.</text>

    <!-- 5 Zielzustand -->
    <rect x="80" y="326" width="470" height="84" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="100" y="352" font-size="16" font-weight="700">Zielzustand der Gruppe</text>
    <text x="100" y="374" font-size="13" fill="#57606a">Was ihn zuletzt geändert hat: du, ein Preset, der Zeitplan</text>
    <text x="100" y="394" font-size="13" fill="#57606a">oder eine vom Sync-Modus übernommene Geräteänderung.</text>
  </g>

  <!-- Klammer für die drei Sperren -->
  <path d="M 560 34 Q 572 34 572 46 L 572 124 Q 572 135 582 135 Q 572 135 572 146 L 572 224 Q 572 236 560 236" stroke="#57606a" stroke-width="2" fill="none"/>
  <g fill="#1f2328">
    <text x="592" y="104" font-size="14" font-weight="600">Sperren</text>
    <text x="592" y="124" font-size="12" fill="#57606a">Der Zielzustand bleibt, wie</text>
    <text x="592" y="140" font-size="12" fill="#57606a">er ist. Endet eine Sperre,</text>
    <text x="592" y="156" font-size="12" fill="#57606a">übernimmt die nächste</text>
    <text x="592" y="172" font-size="12" fill="#57606a">aktive — oder der</text>
    <text x="592" y="188" font-size="12" fill="#57606a">Zielzustand gilt wieder.</text>
  </g>

  <!-- Hinweis Isolation -->
  <rect x="580" y="252" width="195" height="170" rx="10" fill="#eaeef2" stroke="#6e7781" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#1f2328">
    <text x="596" y="278" font-size="15" font-weight="700">Isolierte Geräte</text>
    <text x="596" y="300" font-size="12" fill="#57606a">Bleiben außen vor, solange</text>
    <text x="596" y="316" font-size="12" fill="#57606a">ihre Isolationsregel gilt.</text>
    <text x="596" y="340" font-size="12" fill="#57606a">Nur der Hauptschalter</text>
    <text x="596" y="356" font-size="12" fill="#57606a">erreicht sie noch. Endet</text>
    <text x="596" y="372" font-size="12" fill="#57606a">die Regel, gehören sie</text>
    <text x="596" y="388" font-size="12" fill="#57606a">wieder zur Gruppe und</text>
    <text x="596" y="404" font-size="12" fill="#57606a">folgen ihr wie die anderen.</text>
  </g>
</svg>
