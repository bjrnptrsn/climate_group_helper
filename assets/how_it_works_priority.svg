<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What wins: Main Switch, open window, nobody home, boost, then the group target</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="470" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- "wins" axis -->
  <line x1="50" y1="410" x2="50" y2="40" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="38" y="225" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" transform="rotate(-90 38 225)">takes priority</text>

  <g fill="#1f2328">
    <!-- 1 Main Switch -->
    <rect x="80" y="30" width="470" height="62" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
    <text x="100" y="56" font-size="16" font-weight="700">Main Switch off</text>
    <text x="100" y="78" font-size="13" fill="#57606a">Every device off — isolated ones included.</text>

    <!-- 2 Window -->
    <rect x="80" y="104" width="470" height="62" rx="10" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
    <text x="100" y="130" font-size="16" font-weight="700">Window open</text>
    <text x="100" y="152" font-size="13" fill="#57606a">Off, or the window temperature.</text>

    <!-- 3 Presence -->
    <rect x="80" y="178" width="470" height="62" rx="10" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
    <text x="100" y="204" font-size="16" font-weight="700">Nobody home</text>
    <text x="100" y="226" font-size="13" fill="#57606a">The away action: off, offset, temperature or preset.</text>

    <!-- 4 Boost -->
    <rect x="80" y="252" width="470" height="62" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
    <text x="100" y="278" font-size="16" font-weight="700">Boost</text>
    <text x="100" y="300" font-size="13" fill="#57606a">The boost temperature, for the time you asked for.</text>

    <!-- 5 Target -->
    <rect x="80" y="326" width="470" height="84" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="100" y="352" font-size="16" font-weight="700">Group target</text>
    <text x="100" y="374" font-size="13" fill="#57606a">Whatever changed it last: you, a preset, the schedule,</text>
    <text x="100" y="394" font-size="13" fill="#57606a">or a device change the Sync Mode adopted.</text>
  </g>

  <!-- Brace for the three blocks -->
  <path d="M 560 34 Q 572 34 572 46 L 572 124 Q 572 135 582 135 Q 572 135 572 146 L 572 224 Q 572 236 560 236" stroke="#57606a" stroke-width="2" fill="none"/>
  <g fill="#1f2328">
    <text x="592" y="118" font-size="14" font-weight="600">Blocks</text>
    <text x="592" y="138" font-size="12" fill="#57606a">The target stays as it is.</text>
    <text x="592" y="156" font-size="12" fill="#57606a">When one ends, the next</text>
    <text x="592" y="172" font-size="12" fill="#57606a">active block takes over —</text>
    <text x="592" y="188" font-size="12" fill="#57606a">or the target returns.</text>
  </g>

  <!-- Isolation side note -->
  <rect x="580" y="252" width="195" height="158" rx="10" fill="#eaeef2" stroke="#6e7781" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#1f2328">
    <text x="596" y="278" font-size="15" font-weight="700">Isolated devices</text>
    <text x="596" y="300" font-size="12" fill="#57606a">Stand aside while their</text>
    <text x="596" y="316" font-size="12" fill="#57606a">isolation rule applies.</text>
    <text x="596" y="340" font-size="12" fill="#57606a">Only the Main Switch still</text>
    <text x="596" y="356" font-size="12" fill="#57606a">reaches them. When the rule</text>
    <text x="596" y="372" font-size="12" fill="#57606a">ends, they rejoin the group</text>
    <text x="596" y="388" font-size="12" fill="#57606a">and follow it like the rest.</text>
  </g>
</svg>
